<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Chandu R — Electronics and Communication Engineering student interested in electronics, embedded systems and software.">
  <title>Chandu R</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0d12;color:#f3f4f6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,7vw,64px);border:1px solid #252a35;border-radius:18px;background:linear-gradient(145deg,#121722,#0e1118);box-shadow:0 24px 90px #0006}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#b6f09c;color:#11180f;font-weight:800;font-size:19px;margin-bottom:52px}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a6b09f}
    h1{font-size:clamp(48px,10vw,76px);letter-spacing:-.07em;line-height:1;margin:18px 0 20px;font-weight:750}
    p{max-width:490px;color:#aab2c0;font-size:16px;line-height:1.8;margin:0}
    a{display:inline-flex;align-items:center;gap:10px;margin-top:34px;color:#b6f09c;text-decoration:none;font-size:14px;font-weight:650}
    a:hover{color:#d5ffc3}
    footer{margin-top:64px;color:#687180;font-size:11px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C.</div>
    <div class="eyebrow">Hello, I'm</div>
    <h1>Chandu R</h1>
    <p>Electronics and Communication Engineering student interested in electronics, embedded systems, and software. I enjoy learning, building, and turning ideas into practical solutions.</p>
    <a href="https://github.com/heychandu" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    <footer>KERALA, INDIA</footer>
  </main>
</body>
</html>
